[package]
name = "led-controller"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "led-controller"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["json", "ws"] }
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
tower-http = { version = "0.5", features = ["fs", "cors"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
[features]
hardware = ["dep:rs_ws281x"]
audio    = ["dep:cpal", "dep:rustfft"]

[dependencies.rs_ws281x]
version = "0.3"
optional = true

[dependencies.cpal]
version = "0.15"
optional = true

[dependencies.rustfft]
version = "6"
optional = true

[profile.release]
opt-level = 3
